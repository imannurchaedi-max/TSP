<div class="scan-layout-container">
  <div class="scan-action-pane" id="action-view">
    <div class="btn-grid" id="action-list"></div>
  </div>

  <div class="scan-content-pane">
    <div id="scan-placeholder" style="padding: 40px 20px; text-align: center; color: var(--text-sub); font-weight: 600;">
      <i class="bi bi-upc-scan" style="font-size: 48px; opacity: 0.3; display: block; margin-bottom: 12px;"></i>
      Pilih opsi pemindaian pada menu di samping/atas untuk memulai.
    </div>

    <div id="extra-view" class="panel" style="max-width: 560px; display:none;">
      <div id="reservasi-field" style="display:none; margin-bottom: 18px;">
        <p style="margin-bottom:8px; font-weight:700; font-size:12px; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.05em;">Filter Tanggal Reservasi (SAP):</p>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
          <input type="date" id="reservasi-date-input" style="flex:1; margin-top:0;">
          <button type="button" id="clear-date-btn" class="secondary-btn" style="padding:12px 16px; font-size:13px; width:auto; margin:0; font-weight:700;">Semua Tgl</button>
        </div>

        <p style="margin-bottom:6px; font-weight:700; color:var(--text-main); font-size:14px;">Pilih Nomor Reservasi:</p>
        <select id="reservasi-select" style="margin-top:0;"></select>
        <div id="reservasi-manual-wrap" style="display:none; margin-top:12px;">
          <p style="margin-bottom:6px; font-size:13px; color:var(--text-sub); font-weight:600;">Atau ketik Nomor Reservasi manual:</p>
          <input type="text" id="reservasi-input" placeholder="Contoh: 20748003" style="margin-top:0;">
        </div>
        <div id="reservasi-mid-info" style="display:none; margin-top:16px; padding:16px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:12px; font-size:13.5px; color:#065f46; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.08);">
          <p style="margin:0 0 10px 0; font-weight:800; display:flex; align-items:center; gap:8px; font-size:14px; border-bottom:1px solid #bbf7d0; padding-bottom:8px;">
            <span>✅</span> Daftar Material (MID) yang Diizinkan:
          </p>
          <ul id="reservasi-mid-list" style="margin:0; padding-left:22px; line-height:1.6; font-weight:600;"></ul>
        </div>
      </div>
      <div id="mesin-field" style="display:none; margin-bottom: 18px;">
        <p style="margin-bottom:6px; font-weight:700; color:var(--text-main); font-size:14px;">Pilih mesin tujuan:</p>
        <select id="mesin-select" style="margin-top:0;"></select>
      </div>
      <div id="jumlah-field" style="display:none; margin-bottom: 18px;">
        <p style="margin-bottom:6px; font-weight:700; color:var(--text-main); font-size:14px;">Jumlah yang dikirim:</p>
        <input type="number" id="jumlah-input" min="0" step="any" placeholder="Contoh: 200" style="margin-top:0;">
      </div>
      <button class="action-btn" id="extra-continue" style="margin-top:8px;">Lanjut Scan Barcode</button>
      <button class="secondary-btn" id="extra-cancel">Batal</button>
    </div>

    <div id="scanner-view" style="display:none;">
      <p>Ambil foto barcode/QR yang jelas &amp; fokus.</p>
      <button class="action-btn" id="capture-btn">📷 Ambil Foto Barcode</button>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
      <div class="result-box" id="scan-status" style="display:none; background:#e0e7ff; color:#3730a3;"></div>
      <div id="reader" style="display:none;"></div>
      <button class="secondary-btn" id="scan-cancel">Batal</button>
    </div>

    <div id="result-view" style="display:none;">
      <div class="result-box" id="result-box" style="white-space: pre-line; line-height: 1.6;"></div>
      <div class="result-box" id="child-barcode-box" style="display:none; background:#e0e7ff; color:#3730a3; font-size:18px; font-weight:bold; text-align:center; margin-top:10px;"></div>
      <button class="action-btn" id="scan-again" style="margin-top:10px;">Scan Lagi</button>
      <button class="secondary-btn" id="back-to-menu">Kembali ke Menu</button>
    </div>
  </div>
</div>
<script>
  var html5QrCode = null;
  var currentEvent = null;
  var currentMesin = null;
  var currentJumlah = null;
  var currentReservasi = null;
  var rawReservasiData = [];

  function showView(id) {
    ['extra-view', 'scanner-view', 'result-view'].forEach(function (v) {
      document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
    });
    var ph = document.getElementById('scan-placeholder');
    if (ph) {
      ph.style.display = (!id || id === 'action-view') ? 'block' : 'none';
    }
  }

  function resetScanMenu() {
    showView('');
    document.querySelectorAll('.scan-menu-btn').forEach(function (b) { b.classList.remove('active'); });
  }

  function renderActions() {
    var list = document.getElementById('action-list');
    list.innerHTML = '';
    PAGE_EVENTS.forEach(function (ev) {
      var btn = document.createElement('button');
      btn.className = 'action-card-btn scan-menu-btn';
      if (ev.bg) {
        btn.style.background = ev.bg;
        btn.style.boxShadow = '0 6px 18px ' + (ev.shadow || 'rgba(37, 99, 235, 0.25)');
      }

      var iconClass = ev.icon || 'bi-qr-code-scan';
      var descText = ev.desc || '';

      btn.innerHTML = '<div class="action-card-icon-wrap"><i class="bi ' + iconClass + '"></i></div>' +
                      '<div class="action-card-text-wrap">' +
                        '<div class="action-card-title">' + (ev.label || '') + '</div>' +
                        (descText ? '<div class="action-card-desc">' + descText + '</div>' : '') +
                      '</div>' +
                      '<i class="bi bi-chevron-right action-card-arrow"></i>';

      btn.onclick = function () { 
        document.querySelectorAll('.scan-menu-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        selectEvent(ev); 
      };
      list.appendChild(btn);
    });
  }

  function selectEvent(ev, isRestoring) {
    currentEvent = ev;
    window.currentEvent = ev;
    currentMesin = null;
    currentJumlah = null;
    currentReservasi = null;

    if (ev.requiresMesin || ev.requiresJumlah || ev.requiresReservasi) {
      document.getElementById('reservasi-field').style.display = ev.requiresReservasi ? 'block' : 'none';
      document.getElementById('mesin-field').style.display = ev.requiresMesin ? 'block' : 'none';
      document.getElementById('jumlah-field').style.display = ev.requiresJumlah ? 'block' : 'none';

      if (ev.requiresReservasi) {
        setupReservasiPicker();
      }
      if (ev.requiresMesin) {
        var select = document.getElementById('mesin-select');
        google.script.run.withSuccessHandler(function (list) {
          select.innerHTML = '';
          list.forEach(function (m) {
            var opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            select.appendChild(opt);
          });
        }).getMesinList();
      }
      if (ev.requiresJumlah) {
        document.getElementById('jumlah-input').value = '';
      }
      showView('extra-view');
    } else {
      startScanner();
    }

    if (!isRestoring && typeof pushDeeplinkState === 'function') {
      pushDeeplinkState({ event: ev.code });
    }
  }

  function getTodayIsoString() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return y + '-' + pad(m) + '-' + pad(d);
  }

  function setupReservasiPicker() {
    var dateInput = document.getElementById('reservasi-date-input');
    var select = document.getElementById('reservasi-select');
    var manualWrap = document.getElementById('reservasi-manual-wrap');
    document.getElementById('reservasi-input').value = '';

    dateInput.value = getTodayIsoString();
    select.innerHTML = '<option value="">Memuat daftar reservasi...</option>';
    manualWrap.style.display = 'none';
    var midInfo = document.getElementById('reservasi-mid-info');
    if (midInfo) midInfo.style.display = 'none';

    google.script.run.withSuccessHandler(function (res) {
      if (res.success && res.data && res.data.length > 0) {
        rawReservasiData = res.data;
        renderReservasiOptions();
      } else {
        rawReservasiData = [];
        select.innerHTML = '<option value="__manual__">-- Tidak ada reservasi (Input Manual) --</option>';
        manualWrap.style.display = 'block';
      }
    }).getReservasiOptions();
  }

  function isDateMatch(r, selectedDateIso) {
    if (!selectedDateIso) return true;
    if (r.dateKey === selectedDateIso) return true;
    var p = selectedDateIso.split('-');
    if (p.length === 3) {
      var y = parseInt(p[0], 10);
      var m = parseInt(p[1], 10);
      var d = parseInt(p[2], 10);
      if (r.year === y && r.month === m && r.day === d) return true;
    }
    return false;
  }

  function renderReservasiOptions() {
    var selectedDateIso = document.getElementById('reservasi-date-input').value;
    var select = document.getElementById('reservasi-select');
    var manualWrap = document.getElementById('reservasi-manual-wrap');
    var midInfo = document.getElementById('reservasi-mid-info');
    if (midInfo) midInfo.style.display = 'none';

    select.innerHTML = '';
    var filtered = rawReservasiData;

    // Filter per Date
    if (selectedDateIso) {
      filtered = filtered.filter(function (r) {
        return isDateMatch(r, selectedDateIso);
      });
    }

    if (filtered.length > 0) {
      var defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = '-- Pilih Nomor Reservasi (' + filtered.length + ' item) --';
      select.appendChild(defaultOpt);

      filtered.forEach(function (r) {
        var opt = document.createElement('option');
        opt.value = r.noReservasi;
        var label = r.noReservasi;
        if (r.itemCount && r.itemCount > 1) label += ' (' + r.itemCount + ' item material)';
        if (!selectedDateIso && r.tanggal) label += ' [Tgl: ' + r.tanggal + ']';
        opt.textContent = label;
        select.appendChild(opt);
      });

      var optManual = document.createElement('option');
      optManual.value = '__manual__';
      optManual.textContent = '-- Input Manual No. Reservasi --';
      select.appendChild(optManual);
      manualWrap.style.display = 'none';
    } else {
      var opt = document.createElement('option');
      opt.value = '__manual__';
      opt.textContent = selectedDateIso
        ? '-- Tidak ada reservasi yang sesuai filter (Input Manual) --'
        : '-- Tidak ada reservasi (Input Manual) --';
      select.appendChild(opt);
      manualWrap.style.display = 'block';
    }
  }

  document.getElementById('reservasi-date-input').addEventListener('change', function () {
    renderReservasiOptions();
  });

  document.getElementById('clear-date-btn').addEventListener('click', function () {
    document.getElementById('reservasi-date-input').value = '';
    renderReservasiOptions();
  });

  document.getElementById('reservasi-select').addEventListener('change', function () {
    var val = this.value;
    var manualWrap = document.getElementById('reservasi-manual-wrap');
    var midInfo = document.getElementById('reservasi-mid-info');
    var midList = document.getElementById('reservasi-mid-list');
    manualWrap.style.display = (val === '__manual__') ? 'block' : 'none';
    
    if (midInfo && midList) {
      midInfo.style.display = 'none';
      midList.innerHTML = '';
      if (val && val !== '__manual__' && rawReservasiData) {
        var found = rawReservasiData.find(function (r) { return r.noReservasi === val; });
        if (found && found.items && found.items.length > 0) {
          found.items.forEach(function (item) {
            var li = document.createElement('li');
            li.style.marginBottom = '4px';
            li.innerHTML = '<strong>' + (item.mid || '-') + '</strong> &mdash; ' + (item.desc || '-') + ' (' + item.qty + ' ' + item.uom + ')';
            midList.appendChild(li);
          });
          midInfo.style.display = 'block';
        }
      }
    }
  });

  function startScanner() {
    showView('scanner-view');
    document.getElementById('scan-status').style.display = 'none';
  }

  function handleCapturedFile(file) {
    if (!file) return;
    var statusEl = document.getElementById('scan-status');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Membaca barcode dari foto...';

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode('reader');
    }
    html5QrCode.scanFile(file, true)
      .then(function (decodedText) {
        statusEl.style.display = 'none';
        onScanSuccess(decodedText);
      })
      .catch(function () {
        statusEl.style.display = 'none';
        showResult(false, 'Barcode tidak terbaca dari foto. Coba ambil foto ulang, pastikan barcode fokus & tidak terpotong.', null);
      });
  }

  function onScanSuccess(decodedText) {
    google.script.run
      .withSuccessHandler(function (res) { showResult(res.success, res.message, res.childBarcode, res.warning); })
      .withFailureHandler(function (err) { showResult(false, err.message || String(err), null, false); })
      .submitScan(decodedText, currentEvent.code, currentMesin, currentJumlah, currentReservasi, CURRENT_NIK);
  }

  function showResult(success, message, childBarcode, warning) {
    var box = document.getElementById('result-box');
    var cls = !success ? 'result-error' : (warning ? 'result-warning' : 'result-success');
    box.className = 'result-box ' + cls;
    box.textContent = message;

    var childBox = document.getElementById('child-barcode-box');
    if (childBarcode) {
      childBox.textContent = 'Kode Reprint: ' + childBarcode;
      childBox.style.display = 'block';
    } else {
      childBox.style.display = 'none';
    }
    showView('result-view');
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderActions();
    showView('action-view');

    document.getElementById('capture-btn').onclick = function () {
      document.getElementById('camera-input').value = '';
      document.getElementById('camera-input').click();
    };
    document.getElementById('camera-input').addEventListener('change', function (evt) {
      handleCapturedFile(evt.target.files[0]);
    });

    document.getElementById('extra-continue').onclick = function () {
      if (currentEvent.requiresReservasi) {
        var selectVal = document.getElementById('reservasi-select').value;
        if (selectVal === '__manual__' || !selectVal) {
          currentReservasi = document.getElementById('reservasi-input').value.trim();
        } else {
          currentReservasi = selectVal;
        }

        if (!currentReservasi) {
          showPopupModal('Input Tidak Lengkap', 'Pilih atau isi Nomor Reservasi terlebih dahulu sebelum melanjutkan scan.', 'warning', 'Mengerti');
          return;
        }
      }
      if (currentEvent.requiresMesin) {
        currentMesin = document.getElementById('mesin-select').value;
      }
      if (currentEvent.requiresJumlah) {
        currentJumlah = document.getElementById('jumlah-input').value;
        if (!currentJumlah || Number(currentJumlah) <= 0) {
          showPopupModal('Jumlah Tidak Valid', 'Silakan isi jumlah (Qty) material yang sah dan lebih dari 0 sebelum memulai pemindaian barcode.', 'warning', 'Mengerti');
          return;
        }
      }
      startScanner();
    };
    document.getElementById('extra-cancel').onclick = function () {
      resetScanMenu();
    };
    document.getElementById('scan-cancel').onclick = function () {
      resetScanMenu();
    };
    document.getElementById('scan-again').onclick = function () {
      startScanner();
    };
    document.getElementById('back-to-menu').onclick = function () {
      resetScanMenu();
    };
  });
</script>
